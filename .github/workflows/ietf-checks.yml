name: STCP IETF checks

on:
  push:
    branches: [main, 'work/experimental-draft-finalization-20261107']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vectors:
    name: Cryptographic known-answer vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install crypto test dependency
        run: python -m pip install 'cryptography>=46,<50'
      - name: Run STCP vector tests
        run: python -m unittest discover -s tests -p 'test_stcp_vectors.py' -v

  rfcxml:
    name: Validate RFCXML v3 and render draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RFCXML tooling
        run: python -m pip install 'xml2rfc>=3,<4'
      - name: Parse RFCXML as XML
        run: python -c "import xml.etree.ElementTree as ET; root=ET.parse('internet-draft/draft-paxsudos-stcp-00.xml').getroot(); assert root.tag == 'rfc' and root.attrib.get('version') == '3'"
      - name: Validate and render Internet-Draft
        run: xml2rfc --text --out /tmp/draft-paxsudos-stcp-00.txt internet-draft/draft-paxsudos-stcp-00.xml

  robot:
    name: Offline robot test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install vector and RFCXML dependencies
        run: python -m pip install 'cryptography>=46,<50' 'xml2rfc>=3,<4'
      - name: Run offline robot
        run: python tests/stcp_test_robot.py --report tests/robot-report.json
      - name: Upload robot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stcp-robot-offline-evidence
          path: tests/robot-report.json
          if-no-files-found: warn
