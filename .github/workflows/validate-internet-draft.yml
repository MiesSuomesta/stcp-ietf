name: Validate Internet-Draft

on:
  push:
    branches:
      - work/experimental-draft-finalization-20261107
    paths:
      - 'internet-draft/**'
      - 'tests/vectors/**'
      - '.github/workflows/validate-internet-draft.yml'
  pull_request:
    paths:
      - 'internet-draft/**'
      - '.github/workflows/validate-internet-draft.yml'
  workflow_dispatch:

jobs:
  xml2rfc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install xml2rfc
        run: python -m pip install xml2rfc cryptography
      - name: Verify reference vectors
        run: python tests/vectors/verify_wire3_kdf.py
      - name: Validate and render draft
        run: |
          mkdir -p rendered
          xml2rfc --text -o rendered/draft-paxsudos-stcp-00.txt internet-draft/draft-paxsudos-stcp-00.xml
          xml2rfc --html -o rendered/draft-paxsudos-stcp-00.html internet-draft/draft-paxsudos-stcp-00.xml
      - name: Upload rendered draft
        uses: actions/upload-artifact@v4
        with:
          name: stcp-internet-draft-rendered
          path: rendered/
